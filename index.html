<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>액션 로그라이트 포트폴리오</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6eb; --text:#1d2129; --sub:#5d6573; --accent:#2f5d8a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f1115; --card:#171a20; --line:#2a2f38; --text:#e8eaf0; --sub:#9aa2b1; --accent:#6fa8dc; }
  }
  :root[data-theme="dark"] { --bg:#0f1115; --card:#171a20; --line:#2a2f38; --text:#e8eaf0; --sub:#9aa2b1; --accent:#6fa8dc; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 "IBM Plex Sans KR", system-ui, "Malgun Gothic", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:56px 16px 64px; }
  h1 { font-size:28px; margin:0 0 6px; }
  .sub { color:var(--sub); margin:0 0 36px; }
  a.card { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px 22px; margin-bottom:14px; transition:border-color .15s; }
  a.card:hover { border-color:var(--accent); }
  .num { color:var(--accent); font-weight:700; font-size:13px; }
  .card h2 { font-size:19px; margin:2px 0 6px; }
  .card p { margin:0; color:var(--sub); }
  .go { display:inline-block; margin-top:10px; color:var(--accent); font-weight:500; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>액션 로그라이트 기획 포트폴리오</h1>
  <p class="sub">넷마블네오 AI 인턴십 지원 · 기획서, 그 기획서로 만든 프로토타입, 밸런스 대시보드</p>

  <a class="card" href="docs/">
    <div class="num">01</div>
    <h2>기획서</h2>
    <p>무엇을 만들었고, 왜 이렇게 정했는지.</p>
    <span class="go">기획서 보기 →</span>
  </a>

  <a class="card" href="prototype/">
    <div class="num">02</div>
    <h2>프로토타입</h2>
    <p>브라우저에서 바로 플레이. 방향키 이동, A 공격, Space 대시. 봇이 하는 판을 다시 볼 수도 있다.</p>
    <span class="go">플레이하기 →</span>
  </a>

  <a class="card" href="dashboard/">
    <div class="num">03</div>
    <h2>밸런스 대시보드</h2>
    <p>값을 바꿔 돌리면 봇이 실력마다 여러 판을 돌리고, 결과를 기획서 의도와 비교한다.</p>
    <span class="go">대시보드 열기 →</span>
  </a>
</main>
</body>
</html>
