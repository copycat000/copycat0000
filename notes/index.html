<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업 기록</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>:root{--bg:#f6f7f9;--card:#fff;--line:#e3e6eb;--text:#1d2129;--sub:#5d6573;--accent:#2f5d8a;--th:#f0f2f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#171a20;--line:#2a2f38;--text:#e8eaf0;--sub:#9aa2b1;--accent:#6fa8dc;--th:#1e222a}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#171a20;--line:#2a2f38;--text:#e8eaf0;--sub:#9aa2b1;--accent:#6fa8dc;--th:#1e222a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.75 "IBM Plex Sans KR",system-ui,"Malgun Gothic",sans-serif}
a{color:var(--accent)}nav{border-bottom:1px solid var(--line);background:var(--card)}
nav .in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
nav a{text-decoration:none;color:var(--sub)}nav a.on{color:var(--text);font-weight:700}nav .home{color:var(--accent);margin-right:6px}
main{max-width:880px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:26px;line-height:1.35;margin:0 0 4px}h2{font-size:20px;margin:40px 0 10px;padding-top:8px;border-top:1px solid var(--line)}h3{font-size:17px;margin:28px 0 8px}
h1+p{color:var(--sub);font-size:13px;margin-top:0}
.tw{overflow-x:auto;margin:14px 0}table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55;background:var(--card)}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}th{background:var(--th);white-space:nowrap}
code{font-size:13px;background:var(--th);padding:1px 4px;border-radius:4px}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:14px}
.list a{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:10px}
.list a:hover{border-color:var(--accent)}.list b{font-size:16px}.list span{display:block;color:var(--sub);font-size:14px}</style>
</head>
